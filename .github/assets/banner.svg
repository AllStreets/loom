<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="LOOM — a sovereign, self-evolving computer">
  <defs>
    <radialGradient id="bg" cx="26%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#0b1428"/>
      <stop offset="60%" stop-color="#070d1c"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#0a84ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#04060f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="30%" stop-color="#f6b93b"/>
      <stop offset="72%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#070c1a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe6a3"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- woven threads: the loom -->
  <g stroke="#22314f" stroke-width="1" opacity="0.5">
    <line x1="0" y1="70" x2="1200" y2="20"/>
    <line x1="0" y1="150" x2="1200" y2="120"/>
    <line x1="0" y1="230" x2="1200" y2="270"/>
    <line x1="0" y1="300" x2="1200" y2="330"/>
  </g>

  <!-- the orb: light emerging from dark -->
  <g transform="translate(250 170)">
    <circle r="150" fill="url(#orb)" filter="url(#soft)"/>
    <circle r="82" fill="url(#core)"/>
    <circle r="82" fill="none" stroke="url(#rim)" stroke-width="2.2" opacity="0.9" filter="url(#glow)"/>
    <circle r="82" fill="none" stroke="#fff7e6" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(470 150)" filter="url(#glow)">
    <text x="0" y="0" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="96" font-weight="700" letter-spacing="26" fill="#eaf0fb">LOOM</text>
  </g>
  <text x="472" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" letter-spacing="3" fill="#9fb0cc">a sovereign, self-evolving computer</text>
  <text x="472" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14.5" letter-spacing="2.5" fill="#5f6f8c">offline&#160;&#160;·&#160;&#160;local models&#160;&#160;·&#160;&#160;it rewrites itself&#160;&#160;·&#160;&#160;yours</text>
</svg>
